<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria Interna | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-diamantes { background: linear-gradient(135deg, #450a0a 0%, #991b1b 100%); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <header class="bg-diamantes text-white py-6 px-10 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i data-lucide="shield-check" class="w-8 h-8"></i>
                <h1 class="text-xl font-black uppercase tracking-tighter">Auditoria de Descontos</h1>
            </div>
            <span class="text-[10px] font-bold opacity-60 uppercase tracking-widest">Versão 2.0 | Senior Analyst</span>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-xl w-full bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-12 text-center">
            <div class="bg-red-50 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-8">
                <i data-lucide="file-up" class="w-10 h-10 text-red-600"></i>
            </div>
            
            <h2 class="text-3xl font-black text-slate-800 mb-4 tracking-tight">Iniciar Nova Auditoria</h2>
            <p class="text-slate-500 mb-10 text-sm leading-relaxed">
                Para gerar o painel detalhado, por favor importe o arquivo <br> 
                <span class="font-bold text-slate-700">DESCONTOS_1 - 30%+.CSV</span> extraído do sistema.
            </p>

            <input type="file" id="csvFile" accept=".csv" class="hidden" onchange="irParaPainel()">
            <button onclick="document.getElementById('csvFile').click()" 
                class="w-full bg-slate-900 hover:bg-black text-white py-5 rounded-2xl font-black text-sm uppercase tracking-widest transition-all shadow-xl flex items-center justify-center gap-3 active:scale-95">
                <i data-lucide="upload" class="w-5 h-5"></i>
                Selecionar Arquivo CSV
            </button>

            <p class="mt-8 text-[10px] text-slate-400 font-bold uppercase tracking-widest flex items-center justify-center gap-2">
                <i data-lucide="lock" class="w-3 h-3"></i>
                Processamento Seguro & Local
            </p>
        </div>
    </main>

    <footer class="py-8 text-center text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em]">
        Diamantes Lingerie &copy; 2026 | Departamento de Auditoria Interna
    </footer>

    <script>
        lucide.createIcons();

        function irParaPainel() {
            // Por enquanto, apenas avisa que o arquivo foi lido
            // Na próxima fase, adicionaremos o código que "troca" a tela para o painel
            alert("Arquivo recebido com sucesso! Agora vamos configurar o visual do painel baseado no seu print.");
        }
    </script>
</body>
</html>
