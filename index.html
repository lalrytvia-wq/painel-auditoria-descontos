<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria Interna | Diamantes</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-diamantes { background: linear-gradient(135deg, #450a0a 0%, #991b1b 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const App = () => {
            const [data, setData] = useState([]);
            const [view, setView] = useState('upload'); // upload, visao, lista
            const [selectedItem, setSelectedItem] = useState(null);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                Papa.parse(file, {
                    header: true,
                    delimiter: ";",
                    skipEmptyLines: true,
                    complete: (results) => {
                        setData(results.data);
                        setView('visao');
                    }
                });
            };

            const n = (v) => parseFloat(v?.toString().replace(/\./g, '').replace(',', '.')) || 0;
            const f = (v) => v.toLocaleString('pt-br', { style: 'currency', currency: 'BRL' });

            // Cálculos do seu Painel
            const stats = useMemo(() => {
                let tDesc = 0, sPerc = 0, crit = 0;
                data.forEach(item => {
                    const d = n(item["Vl. Desconto"]);
                    const p = n(item["Pr. Desconto"]);
                    tDesc += d; sPerc += p;
                    if (p > 50) crit++;
                });
                return { total: data.length, desc: tDesc, medio: (sPerc/data.length || 0), crit };
            }, [data]);

            if (view === 'upload') {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6">
                        <div className="max-w-md w-full bg-white rounded-[2rem] shadow-2xl p-10 text-center border border-slate-100">
                            <h2 className="text-2xl font-black text-slate-800 mb-6">Iniciar Auditoria</h2>
                            <label className="cursor-pointer bg-slate-900 text-white px-8 py-4 rounded-xl font-bold uppercase text-xs tracking-widest block hover:bg-black transition-all">
                                Selecionar CSV
                                <input type="file" className="hidden" onChange={handleFileUpload} accept=".csv" />
                            </label>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50">
                    <header className="bg-diamantes text-white p-8 shadow-xl">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <h1 className="text-3xl font-black uppercase tracking-tighter">Análise Completa</h1>
                            <div className="flex gap-2 bg-black/20 p-1 rounded-xl">
                                <button onClick={() => setView('visao')} className={`px-6 py-2 rounded-lg font-bold text-xs ${view === 'visao' ? 'bg-red-800 shadow-lg' : 'opacity-50'}`}>VISÃO GERAL</button>
                                <button onClick={() => setView('lista')} className={`px-6 py-2 rounded-lg font-bold text-xs ${view === 'lista' ? 'bg-red-800 shadow-lg' : 'opacity-50'}`}>LISTA DETALHADA</button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto p-8 space-y-8">
                        {view === 'visao' ? (
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 font-black">
                                    <p className="text-[10px] text-slate-400 uppercase">Total</p>
                                    <p className="text-3xl text-slate-800">{stats.total}</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-red-100 border-l-8 border-l-red-600 font-black">
                                    <p className="text-[10px] text-red-500 uppercase">Descontos</p>
                                    <p className="text-3xl text-red-600">{f(stats.desc)}</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 font-black">
                                    <p className="text-[10px] text-slate-400 uppercase">Média</p>
                                    <p className="text-3xl text-slate-800">{stats.medio.toFixed(1)}%</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100 border-l-8 border-l-orange-500 font-black">
                                    <p className="text-[10px] text-orange-500 uppercase">Críticos</p>
                                    <p className="text-3xl text-orange-600">{stats.crit}</p>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 border-b font-black text-[10px] uppercase text-slate-400">
                                        <tr>
                                            <th className="px-6 py-4">Transação</th>
                                            <th className="px-6 py-4">Loja</th>
                                            <th className="px-6 py-4 text-right">Líquido</th>
                                            <th className="px-6 py-4 text-center">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {data.map((item, i) => (
                                            <tr key={i} className="hover:bg-slate-50 transition-colors">
                                                <td className="px-6 py-4 font-bold text-slate-400">#{item["Nr. Transação"]}</td>
                                                <td className="px-6 py-4 font-black text-slate-600 uppercase text-[10px]">{item["Ds. Loja"]}</td>
                                                <td className="px-6 py-4 text-right font-black">{f(n(item["Vl. Totalliquido"]))}</td>
                                                <td className="px-6 py-4 text-center">
                                                    <button onClick={() => setSelectedItem(item)} className="bg-slate-100 hover:bg-slate-200 px-3 py-1 rounded-lg font-bold text-[10px] uppercase">Ver Detalhes</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </main>

                    {/* MODAL DE DETALHES FIEL AO SEU TXT */}
                    {selectedItem && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-6 z-50 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl">
                                <div className="bg-diamantes p-6 text-white flex justify-between items-center">
                                    <h3 className="font-black uppercase tracking-tighter">Detalhes da Transação</h3>
                                    <button onClick={() => setSelectedItem(null)} className="text-2xl">&times;</button>
                                </div>
                                <div className="p-8 space-y-4">
                                    <div className="flex justify-between border-b pb-4">
                                        <p className="text-xs font-bold text-slate-400 uppercase">Loja</p>
                                        <p className="font-black text-slate-700">{selectedItem["Ds. Loja"]}</p>
                                    </div>
                                    <div className="flex justify-between border-b pb-4">
                                        <p className="text-xs font-bold text-slate-400 uppercase">Vendedor</p>
                                        <p className="font-black text-slate-700">{selectedItem["Ds. Vendedor"]}</p>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-2xl flex justify-between">
                                        <p className="text-xs font-bold text-slate-400 uppercase">Valor do Desconto</p>
                                        <p className="font-black text-red-600">{f(n(selectedItem["Vl. Desconto"]))}</p>
                                    </div>
                                </div>
                                <div className="p-6 text-right border-t">
                                    <button onClick={() => setSelectedItem(null)} className="bg-slate-900 text-white px-8 py-3 rounded-xl font-black text-[10px] uppercase">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
