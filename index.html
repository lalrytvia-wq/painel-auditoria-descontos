<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise Completa de Descontos | Auditoria Interna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .header-bg { background: linear-gradient(90deg, #450a0a 0%, #991b1b 100%); }
        .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .btn-active { background-color: #7f1d1d; border: 1px solid #991b1b; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .table-res { max-height: 550px; overflow-y: auto; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-900">

    <header class="header-bg text-white py-10 px-12 shadow-2xl border-b-4 border-red-900">
        <div class="max-w-[1500px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-8">
            <div class="flex items-center gap-5">
                <div class="bg-white/10 p-4 rounded-2xl backdrop-blur-sm">
                    <i data-lucide="shield-check" class="w-12 h-12 text-white"></i>
                </div>
                <div>
                    <h1 class="text-4xl font-black uppercase tracking-tighter leading-none">Análise Completa</h1>
                    <p class="text-red-200 text-[11px] font-bold tracking-[0.4em] uppercase mt-2 opacity-80">Auditoria Interna de Descontos</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-6">
                <input type="file" id="csvFile" accept=".csv" class="hidden" onchange="processarArquivo(this)">
                <button onclick="document.getElementById('csvFile').click()" class="bg-white text-red-900 hover:bg-red-50 px-10 py-4 rounded-2xl font-black text-sm flex items-center gap-3 transition-all shadow-2xl active:scale-95 border-b-4 border-slate-200">
                    <i data-lucide="upload" class="w-5 h-5"></i> IMPORTAR CSV
                </button>
                
                <div class="flex bg-black/20 p-2 rounded-2xl border border-white/10">
                    <button class="px-8 py-3 rounded-xl font-bold text-xs uppercase opacity-50 hover:opacity-100 transition-all">Visão Geral</button>
                    <button class="btn-active px-8 py-3 rounded-xl font-bold text-xs uppercase shadow-lg">Lista Detalhada</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-[1500px] mx-auto p-12 space-y-12">

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <div class="bg-white p-8 rounded-[2rem] border border-slate-200 card-shadow flex justify-between items-center">
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Total Analisado</p>
                    <h3 id="kpi-total" class="text-5xl font-black text-slate-800 mt-3 tracking-tighter">0</h3>
                </div>
                <div class="p-4 bg-slate-50 rounded-2xl text-slate-300"><i data-lucide="database" class="w-8 h-8"></i></div>
            </div>

            <div class="bg-white p-8 rounded-[2rem] border border-red-100 card-shadow flex justify-between items-center border-l-[12px] border-l-red-700">
                <div>
                    <p class="text-[10px] font-black text-red-600 uppercase tracking-[0.2em]">Valor Descontos</p>
                    <h3 id="kpi-prejuizo" class="text-5xl font-black text-red-700 mt-3 tracking-tighter">R$ 0</h3>
                </div>
                <div class="p-4 bg-red-50 rounded-2xl text-red-200"><i data-lucide="trending-down" class="w-8 h-8"></i></div>
            </div>

            <div class="bg-white p-8 rounded-[2rem] border border-slate-200 card-shadow flex justify-between items-center">
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Média Geral</p>
                    <h3 id="kpi-medio" class="text-5xl font-black text-slate-800 mt-3 tracking-tighter">0%</h3>
                </div>
                <div class="p-4 bg-slate-50 rounded-2xl text-slate-300"><i data-lucide="percent" class="w-8 h-8"></i></div>
            </div>

            <div class="bg-white p-8 rounded-[2rem] border border-orange-100 card-shadow flex justify-between items-center border-l-[12px] border-l-orange-500">
                <div>
                    <p class="text-[10px] font-black text-orange-600 uppercase tracking-[0.2em]">Críticos (>50%)</p>
                    <h3 id="kpi-alertas" class="text-5xl font-black text-orange-600 mt-3 tracking-tighter">0</h3>
                </div>
                <div class="p-4 bg-orange-50 rounded-2xl text-orange-200"><i data-lucide="alert-triangle" class="w-8 h-8"></i></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div class="lg:col-span-2 bg-blue-800 p-12 rounded-[3.5rem] text-white relative overflow-hidden shadow-2xl">
                <div class="relative z-10">
                    <p class="text-blue-300 font-black uppercase text-xs tracking-[0.4em]">Maior Desconto Identificado</p>
                    <h3 id="rec-id" class="text-6xl font-black mt-6 tracking-tighter">#---</h3>
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mt-16 gap-6">
                        <span id="rec-percent" class="text-[9rem] font-black leading-[0.
