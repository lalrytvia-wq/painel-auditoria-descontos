<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria Interna | Diamantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-header { background: linear-gradient(90deg, #450a0a 0%, #991b1b 100%); }
        .card-drop { transition: all 0.3s ease; border: 2px dashed #e2e8f0; }
        .card-drop:hover { border-color: #991b1b; background-color: #fef2f2; }
    </style>
</head>
<body class="bg-[#fcfcfc] min-h-screen flex flex-col">

    <header class="bg-header text-white py-4 px-8 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
                <h1 class="text-sm font-extrabold uppercase tracking-tight">Auditoria de Descontos</h1>
            </div>
            <span class="text-[9px] font-bold opacity-50 uppercase tracking-widest">Acesso Analista Senior</span>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 text-center">
            
            <h2 class="text-xl font-extrabold text-slate-800 mb-2">Iniciar Nova Auditoria</h2>
            <p class="text-slate-500 mb-8 text-xs leading-relaxed">
                Importe o arquivo <span class="font-bold text-slate-700 underline">DESCONTOS_1 - 30%+.CSV</span><br>para gerar o painel detalhado.
            </p>

            <input type="file" id="csvFile" accept=".csv" class="hidden" onchange="alert('Arquivo carregado. Aguardando o modelo do painel!')">
            <div onclick="document.getElementById('csvFile').click()" class="card-drop rounded-2xl p-10 cursor-pointer group">
                <div class="bg-red-50 w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                    <i data-lucide="upload-cloud" class="w-6 h-6 text-red-600"></i>
                </div>
                <span class="text-xs font-bold text-slate-600 uppercase tracking-wider">Selecionar Arquivo CSV</span>
            </div>

            <div class="mt-6 flex items-center justify-center gap-2 text-slate-400">
                <i data-lucide="lock" class="w-3 h-3"></i>
                <span class="text-[9px] font-bold uppercase tracking-widest">Processamento Seguro & Local</span>
            </div>
        </div>
    </main>

    <footer class="py-6 text-center text-slate-300 text-[9px] font-bold uppercase tracking-[0.2em]">
        Diamantes Lingerie &copy; 2026
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
