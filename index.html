<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria de Descontos Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="bg-gradient-to-r from-red-900 to-red-600 text-white p-6 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i data-lucide="shield-alert" class="w-8 h-8"></i>
                <h1 class="text-2xl font-bold">Auditoria de Descontos</h1>
            </div>
            <div class="flex gap-3">
                <input type="file" id="csvFile" accept=".csv" class="hidden" onchange="processarArquivo(this)">
                <button onclick="document.getElementById('csvFile').click()" class="bg-white text-red-700 px-4 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-red-50 transition-all shadow-md">
                    <i data-lucide="upload-cloud" class="w-4 h-4"></i> Carregar Relatório CSV
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase">Total Analisado</p>
                <h3 id="kpi-total" class="text-3xl font-bold text-slate-800 mt-1">0</h3>
                <p class="text-sm text-slate-500">Transações</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-red-100">
                <p class="text-xs font-bold text-red-400 uppercase">Valor Descontos</p>
                <h3 id="kpi-prejuizo" class="text-3xl font-bold text-red-600 mt-1">R$ 0</h3>
                <p class="text-sm text-red-400">Total Concedido</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase">Desconto Médio</p>
                <h3 id="kpi-medio" class="text-3xl font-bold text-slate-800 mt-1">0%</h3>
                <p class="text-sm text-slate-500">Geral</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-orange-100">
                <p class="text-xs font-bold text-orange-400 uppercase">Alertas (>50%)</p>
                <h3 id="kpi-alertas" class="text-3xl font-bold text-orange-600 mt-1">0</h3>
                <p class="text-sm text-orange-400">Casos Críticos</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 font-bold flex items-center gap-2">
                <i data-lucide="list"></i> Detalhes das Transações
            </div>
            <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 sticky top-0 text-slate-500 text-xs uppercase">
                        <tr>
                            <th class="px-6 py-3">Data</th>
                            <th class="px-6 py-3">Loja</th>
                            <th class="px-6 py-3">Vendedor</th>
                            <th class="px-6 py-3">Produto</th>
                            <th class="px-6 py-3 text-right">Preço Bruto</th>
                            <th class="px-6 py-3 text-right">Líquido</th>
                            <th class="px-6 py-3 text-right">% Desc.</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo" class="divide-y divide-slate-100">
                        <tr><td colspan="7" class="px-6 py-10 text-center text-slate-400">Carregue um arquivo para visualizar os dados</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function processarArquivo(input) {
            const file = input.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const dados = results.data;
                    atualizarDashboard(dados);
                }
            });
        }

        function formatarMoeda(valor) {
            return parseFloat(valor || 0).toLocaleString('pt-br', { style: 'currency', currency: 'BRL' });
        }

        function atualizarDashboard(dados) {
            let totalDescontoVal = 0;
            let totalItens = dados.length;
            let somaPercentual = 0;
            let alertas = 0;
            let htmlTabela = "";

            dados.forEach(item => {
                // Mapeando suas colunas conforme o print
                const bruto = parseFloat(item["Vl. Unitbru"]?.replace(',', '.') || 0);
                const liq = parseFloat(item["Vl. Totallic"]?.replace(',', '.') || 0);
                const descVal = parseFloat(item["Vl. Descor"]?.replace(',', '.') || 0);
                
                // Cálculo de percentual
                const percentual = bruto > 0 ? (descVal / bruto) * 100 : 0;
                
                totalDescontoVal += descVal;
                somaPercentual += percentual;
                if (percentual > 50) alertas++;

                htmlTabela += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4">${item["Dt. Transa"] || '-'}</td>
                        <td class="px-6 py-4">${item["Ds. Loja"] || '-'}</td>
                        <td class="px-6 py-4">${item["Ds. Vende"] || '-'}</td>
                        <td class="px-6 py-4">${item["Ds. Produ"] || '-'}</td>
                        <td class="px-6 py-4 text-right">${formatarMoeda(bruto)}</td>
                        <td class="px-6 py-4 text-right">${formatarMoeda(liq)}</td>
                        <td class="px-6 py-4 text-right font-bold ${percentual > 40 ? 'text-red-600' : 'text-slate-700'}">${percentual.toFixed(2)}%</td>
                    </tr>
                `;
            });

            // Atualiza KPIs
            document.getElementById('kpi-total').innerText = totalItens;
            document.getElementById('kpi-prejuizo').innerText = formatarMoeda(totalDescontoVal);
            document.getElementById('kpi-medio').innerText = (somaPercentual / totalItens).toFixed(1) + "%";
            document.getElementById('kpi-alertas').innerText = alertas;
            document.getElementById('tabela-corpo').innerHTML = htmlTabela;

            lucide.createIcons();
        }

        lucide.createIcons();
    </script>
</body>
</html>
