<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria de Descontos | Diamantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .header-red { background: linear-gradient(90deg, #450a0a 0%, #991b1b 100%); }
        .card-custom { border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card-custom:hover { transform: translateY(-4px); }
        .hidden-page { display: none !important; }
    </style>
</head>
<body>

    <div id="page-upload" class="min-h-screen flex flex-col items-center justify-center p-6">
        <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-10 text-center border border-slate-100">
            <div class="bg-red-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <i data-lucide="upload-cloud" class="w-8 h-8 text-red-600"></i>
            </div>
            <h2 class="text-2xl font-[900] text-slate-800 mb-2">Nova Auditoria</h2>
            <p class="text-slate-400 text-xs mb-8">Importe o arquivo <b>DESCONTOS_1 - 30%+.CSV</b></p>
            <input type="file" id="csvFile" accept=".csv" class="hidden" onchange="processar(this)">
            <button onclick="document.getElementById('csvFile').click()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg hover:bg-black transition-all">Selecionar Arquivo</button>
        </div>
    </div>

    <div id="page-dashboard" class="hidden-page min-h-screen">
        <header class="header-red text-white p-8 shadow-xl">
            <div class="max-w-[1440px] mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex items-center gap-4">
                    <i data-lucide="shield-alert" class="w-10 h-10"></i>
                    <h1 class="text-3xl font-[900] uppercase tracking-tighter">Análise Completa</h1>
                </div>
                <div class="flex bg-black/20 p-1.5 rounded-2xl border border-white/10">
                    <button onclick="tab('v')" id="bv" class="px-8 py-2.5 rounded-xl font-bold text-xs bg-red-900 shadow-lg">Visão Geral</button>
                    <button onclick="tab('l')" id="bl" class="px-8 py-2.5 rounded-xl font-bold text-xs opacity-50">Lista Detalhada</button>
                </div>
            </div>
        </header>

        <main class="max-w-[1440px] mx-auto p-10 space-y-10">
            <div id="visao-kpis" class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="bg-white p-8 card-custom">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Analisado</p>
                    <h3 id="k-tot" class="text-4xl font-black text-slate-800 mt-2">0</h3>
                </div>
                <div class="bg-white p-8 card-custom border-l-8 border-l-red-600">
                    <p class="text-[10px] font-black text-red-500 uppercase tracking-widest">Valor Descontos</p>
                    <h3 id="k-prej" class="text-4xl font-black text-red-600 mt-2">R$ 0</h3>
                </div>
                <div class="bg-white p-8 card-custom">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Desc. Médio</p>
                    <h3 id="k-med" class="text-4xl font-black text-slate-800 mt-2">0%</h3>
                </div>
                <div class="bg-white p-8 card-custom border-l-8 border-l-orange-500">
                    <p class="text-[10px] font-black text-orange-500 uppercase tracking-widest">Alertas (>50%)</p>
                    <h3 id="k-crit" class="text-4xl font-black text-orange-600 mt-2">0</h3>
                </div>
            </div>

            <div id="lista-tab" class="bg-white rounded-[2.5rem] border border-slate-200 shadow-2xl overflow-hidden">
                <div class="p-8 border-b bg-slate-50/50 flex justify-between items-center">
                    <h3 class="font-black text-slate-700 text-sm uppercase tracking-widest flex items-center gap-3">
                        <i data-lucide="list"></i> Relatório de Transações
                    </h3>
                    <span id="cont" class="text-[10px] font-black bg-slate-800 text-white px-4 py-1.5 rounded-full">0 ITENS</span>
                </div>
                <div class="overflow-x-auto max-h-[600px]">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-white sticky top-0 border-b shadow-sm">
                            <tr class="text-slate-400 font-black text-[10px] uppercase tracking-widest">
                                <th class="px-8 py-5">Transação</th>
                                <th class="px-8 py-5">Loja</th>
                                <th class="px-8 py-5 text-right">Bruto</th>
                                <th class="px-8 py-5 text-right">Líquido</th>
                                <th class="px-8 py-5 text-center">Desconto</th>
                            </tr>
                        </thead>
                        <tbody id="corpo" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let d = [];
        const n = v => parseFloat(v?.toString().replace(/\./g, '').replace(',', '.')) || 0;
        const f = v => v.toLocaleString('pt-br', { style: 'currency', currency: 'BRL' });

        function processar(input) {
            Papa.parse(input.files[0], {
                header: true, delimiter: ";", encoding: "UTF-8", skipEmptyLines: true,
                complete: function(res) {
                    d = res.data;
                    let tD = 0, sP = 0, c = 0, h = "";
                    d.forEach(i => {
                        const b = n(i["Vl. Unitbruto"]), l = n(i["Vl. Totalliquido"]), de = n(i["Vl. Desconto"]), p = n(i["Pr. Desconto"]);
                        tD += de; sP += p; if(p > 50) c++;
                        h += `<tr class="hover:bg-slate-50 font-medium">
                            <td class="px-8 py-5 font-bold text-slate-400">#${i["Nr. Transação"]}</td>
                            <td class="px-8 py-5 font-black text-slate-600 text-[10px] uppercase">${i["Ds. Loja"]}</td>
                            <td class="px-8 py-5 text-right text-slate-400">${f(b)}</td>
                            <td class="px-8 py-5 text-right font-black text-slate-800">${f(l)}</td>
                            <td class="px-8 py-5 text-center"><span class="px-3 py-1 rounded-lg text-[10px] font-black ${p > 45 ? 'bg-red-600 text-white' : 'bg-orange-100 text-orange-700'}">${p.toFixed(1)}%</span></td>
                        </tr>`;
                    });
                    document.getElementById('k-tot').innerText = d.length;
                    document.getElementById('k-prej').innerText = f(tD);
                    document.getElementById('k-med').innerText = (sP / d.length).toFixed(1) + "%";
                    document.getElementById('k-crit').innerText = c;
                    document.getElementById('corpo').innerHTML = h;
                    document.getElementById('cont').innerText = d.length + " REGISTROS";
                    document.getElementById('page-upload').classList.add('hidden-page');
                    document.getElementById('page-dashboard').classList.remove('hidden-page');
                    lucide.createIcons();
                }
            });
        }

        function tab(t) {
            const v = t === 'v';
            document.getElementById('visao-kpis').classList.toggle('hidden-page', !v);
            document.getElementById('bv').className = v ? "px-8 py-2.5 rounded-xl font-bold text-xs bg-red-900 shadow-lg" : "px-8 py-2.5 rounded-xl font-bold text-xs opacity-50";
            document.getElementById('bl').className = !v ? "px-8 py-2.5 rounded-xl font-bold text-xs bg-red-900 shadow-lg" : "px-8 py-2.5 rounded-xl font-bold text-xs opacity-50";
        }
        lucide.createIcons();
    </script>
</body>
</html>
